name: Stale
on:
  schedule:
    - cron: "0 3 * * *"
permissions:
  issues: write
  pull-requests: write
jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 30
          days-before-close: 7
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          exempt-issue-labels: "epic,prio-high"
          exempt-pr-labels: "epic,prio-high"
          stale-issue-message: "Dieses Issue ist seit 30 Tagen inaktiv. Bitte aktualisieren oder es wird automatisch geschlossen."
          stale-pr-message: "Dieser PR ist seit 30 Tagen inaktiv. Bitte aktualisieren oder er wird automatisch geschlossen."
